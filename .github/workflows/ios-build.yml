name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Flutter iOS
    runs-on: macos-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar el entorno de Flutter de forma limpia (sin duplicados)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 3. Descargar las dependencias de Flutter (pubspec.yaml)
      - name: Install dependencies
        run: flutter pub get

      # 4. Instalar los Pods de CocoaPods (dependencias nativas de iOS)
      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      # 5. Compilar el archivo para iOS sin firma digital
      - name: Build iOS Application
        run: flutter build ios --no-codesign --release

      # 6. Guardar el resultado compilado con la ruta de salida correcta de Xcode
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-output
          path: build/ios/Release-iphoneos/Runner.app

